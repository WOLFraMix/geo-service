services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.2.103   # LTS-версия: стабильная
    environment:
      # CLICKHOUSE_PASSWORD задаёт пароль пользователю default.
      CLICKHOUSE_PASSWORD: "dev123"
    ports:
      - "8123:8123"   # HTTP-интерфейс: веб-консоль, curl-запросы
      - "9000:9000"   # NATIVE-протокол: именно его использует clickhouse-go
    volumes:
      - clickhouse-data:/var/lib/clickhouse   # данные переживают пересоздание
    # ClickHouse любит открытые файловые дескрипторы:
    # дефолтного лимита Linux ему может не хватить, поднимаем явно
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data:
